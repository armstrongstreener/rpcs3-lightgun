name: Split portable workspace build kit
on:
  push:
    branches: [mlgb-lightgun]
    paths: [.github/workflows/workspace-build-kit-parts.yml]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  split:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Download the prepared build kit
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run download 42601839705 --repo "${{ github.repository }}" --name MLGB-Workspace-Build-Kit --dir kit
      - name: Split without changing the archive bytes
        run: |
          sha256sum kit/MLGB-Workspace-Build-Kit.7z > kit/BUILD-KIT.sha256
          split -b 400M -d -a 3 kit/MLGB-Workspace-Build-Kit.7z kit/MLGB-Workspace-Build-Kit.7z.part-
      - uses: actions/upload-artifact@v4
        with:
          name: Workspace-kit-part-000
          path: kit/*.part-000
          compression-level: 0
          retention-days: 7
      - uses: actions/upload-artifact@v4
        with:
          name: Workspace-kit-part-001
          path: kit/*.part-001
          compression-level: 0
          retention-days: 7
      - uses: actions/upload-artifact@v4
        with:
          name: Workspace-kit-part-002
          path: kit/*.part-002
          compression-level: 0
          retention-days: 7
      - uses: actions/upload-artifact@v4
        with:
          name: Workspace-kit-checksum
          path: kit/BUILD-KIT.sha256
          retention-days: 7
